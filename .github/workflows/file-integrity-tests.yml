name: File integrity tests

on:
  push:
    paths:
      - 'tools/file-integrity/**'
      - 'tests/file-integrity/**'
      - '.github/workflows/file-integrity-tests.yml'
  pull_request:
    paths:
      - 'tools/file-integrity/**'
      - 'tests/file-integrity/**'
      - '.github/workflows/file-integrity-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run synthetic tests
        run: python -m unittest discover -s tests/file-integrity -v
      - name: Check source entry point
        run: python tools/file-integrity/file_integrity.py --version
